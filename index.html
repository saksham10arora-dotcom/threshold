  const gt=new THREE.CanvasTexture(gc); gt.wrapS=gt.wrapT=THREE.RepeatWrapping; gt.repeat.set(300,300); gt.anisotropy=8; gt.encoding=THREE.sRGBEncoding;
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(1500,1500),new THREE.MeshBasicMaterial({map:gt})); fl.rotation.x=-Math.PI/2; s.add(fl);
  const wc=document.createElement('canvas'); wc.width=64; wc.height=256; const wg=wc.getContext('2d'); wg.fillStyle='#07020f'; wg.fillRect(0,0,64,256);
  for(let y=0;y<40;y++) for(let x=0;x<8;x++) if(rnd()<.42){ wg.fillStyle=['#ff3fb4','#5ff3ff','#ffd166','#b48cff'][rnd()*4|0]; wg.fillRect(x*8+2,y*6.4+1.5,4.5,3.4); }
  const wt=new THREE.CanvasTexture(wc); wt.encoding=THREE.sRGBEncoding; wt.magFilter=THREE.NearestFilter;
  const tower=new THREE.MeshBasicMaterial({map:wt});
  s.add(inst(new THREE.BoxGeometry(1,1,1),tower,small?260:520,d=>{ const q=ringPos(26,420), h=30+rnd()*110; d.position.set(q[0],170-h/2,q[1]); d.scale.set(10+rnd()*14,h,10+rnd()*14); }));
  s.add(inst(new THREE.BoxGeometry(1,1,1),tower,small?120:240,d=>{ const q=ringPos(34,420), h=6+rnd()*34; d.position.set(q[0],h/2,q[1]); d.scale.set(7+rnd()*10,h,7+rnd()*10); }));
  const D=doors[4], sc=document.createElement('canvas'); sc.width=sc.height=256; const sg2=sc.getContext('2d'), gr=sg2.createLinearGradient(0,0,0,256); gr.addColorStop(0,'#ffe27a'); gr.addColorStop(.55,'#ff5fa8'); gr.addColorStop(1,'#b02cff');
  sg2.fillStyle=gr; sg2.beginPath(); sg2.arc(128,128,126,0,7); sg2.fill(); sg2.globalCompositeOperation='destination-out'; for(let i=0;i<7;i++) sg2.fillRect(0,140+i*17,256,3+i*1.7);
  const st=new THREE.CanvasTexture(sc); st.encoding=THREE.sRGBEncoding; const sun=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshBasicMaterial({map:st,transparent:true,fog:false,side:THREE.DoubleSide}));
  sun.position.set(D.c.x*70,80,D.c.z*70); sun.lookAt(0,80,0); s.add(sun);
  const rings=[]; for(let i=0;i<12;i++){ const r=new THREE.Mesh(new THREE.TorusGeometry(5.5,.16,6,40),E([0x5ff3ff,0xff3fb4,0xffd166][i%3],1.3)); r.position.set(D.c.x*(2+i*1.5),5+Math.sin(i*.8)*1.6,D.c.z*(2+i*1.5)); r.lookAt(0,5,0); s.add(r); rings.push(r); }
  upd.push(t=>{ rings.forEach((r,i)=>{ r.rotation.z=t*.5+i; r.scale.setScalar(1+Math.sin(t*1.4+i*.7)*.12); }); });
  const f=frame(4,DCOL[0],'Back'); s.add(f); w.frames[4]=f; }

worlds.forEach(w=>{ const set=new Set(); w.scene.traverse(o=>{ if(o.material) set.add(o.material); }); w.mats=[...set]; });

/* ---------- portal passes ---------- */
const maskMat=new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:false,side:THREE.DoubleSide,stencilWrite:true,stencilFunc:THREE.AlwaysStencilFunc,stencilZPass:THREE.ReplaceStencilOp});
const mask=new THREE.Mesh(new THREE.PlaneGeometry(DW,DH),maskMat), maskScene=new THREE.Scene(); maskScene.add(mask);
const clearMat=new THREE.ShaderMaterial({vertexShader:'void main(){gl_Position=vec4(position.xy,1.,1.);}',fragmentShader:'void main(){gl_FragColor=vec4(0.);}',
  colorWrite:false,depthWrite:true,depthFunc:THREE.AlwaysDepth,stencilWrite:true,stencilFunc:THREE.EqualStencilFunc});
const clearQ=new THREE.Mesh(new THREE.PlaneGeometry(2,2),clearMat), clearScene=new THREE.Scene(), ortho=new THREE.OrthographicCamera(-1,1,1,-1,0,1); clearQ.frustumCulled=false; clearScene.add(clearQ);
const plane=new THREE.Plane(), NOCLIP=[], CLIP=[plane], tv=new THREE.Vector3();
function setStencil(w,ref){ for(const m of w.mats){ if(ref){ m.stencilWrite=true; m.stencilFunc=THREE.EqualStencilFunc; m.stencilRef=ref; } else m.stencilWrite=false; } }
let cur=0;
function render(){
  R.clippingPlanes=NOCLIP; R.clear(true,true,true); const cw=worlds[cur]; setStencil(cw,0); R.render(cw.scene,cam);
  for(let d=1;d<=4;d++){ if(cur!==0&&cur!==d) continue; const D=doors[d], tw=worlds[cur===0?d:0];
    mask.position.set(D.c.x,DH/2,D.c.z); mask.rotation.y=Math.atan2(D.n.x,D.n.z); maskMat.stencilRef=d; R.render(maskScene,cam);
    clearMat.stencilRef=d; R.render(clearScene,ortho);
    const s=tv.copy(cam.position).sub(D.c).dot(D.n)>=0?1:-1; plane.setFromNormalAndCoplanarPoint(tv.copy(D.n).multiplyScalar(-s),D.c);
    R.clippingPlanes=CLIP; setStencil(tw,d); tw.frames[d].visible=false; R.render(tw.scene,cam); tw.frames[d].visible=true; R.clippingPlanes=NOCLIP; }
}

/* ---------- walking ---------- */
const P={x:0,z:0,yaw:Math.PI*.25,pitch:.04,idle:true}; const keys={}, roomEl=document.getElementById('room');
addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault(); keys[k]=true; P.idle=false; });
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; }); addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
const ptr=new Map(); let stick=null, sx=0, sy=0;
canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId); P.idle=false; const mv=e.pointerType==='touch'&&e.clientX<innerWidth*.45&&!stick; ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,mv}); if(mv) stick={id:e.pointerId,x:e.clientX,y:e.clientY}; });
canvas.addEventListener('pointermove',e=>{ const p=ptr.get(e.pointerId); if(!p) return;
  if(p.mv){ sx=Math.max(-1,Math.min(1,(e.clientX-stick.x)/60)); sy=Math.max(-1,Math.min(1,(e.clientY-stick.y)/60)); }
  else { P.yaw-=(e.clientX-p.x)*.0042; P.pitch=Math.max(-1.3,Math.min(1.3,P.pitch-(e.clientY-p.y)*.0042)); p.x=e.clientX; p.y=e.clientY; } });
const pend=e=>{ const p=ptr.get(e.pointerId); if(!p) return; if(p.mv){ stick=null; sx=sy=0; } ptr.delete(e.pointerId); };
canvas.addEventListener('pointerup',pend); canvas.addEventListener('pointercancel',pend);

let lw=0,lh=0; function resize(){ const w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight; if(w<2||h<2) return false; if(w===lw&&h===lh) return true; lw=w; lh=h; R.setSize(w,h,false); cam.aspect=w/h; cam.fov=w<h?88:72; cam.updateProjectionMatrix(); return true; }
let last=performance.now()/1000,time=0,bob=0;
function tick(now){
  if(!resize()) return; const dt=Math.min(.05,Math.max(.001,now-last)); last=now; time+=dt;
  if(P.idle&&!calm) P.yaw+=dt*.16;
  const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-sy, r=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+sx;
  const sp=(keys.shift?11:5.6)*dt, fx=-Math.sin(P.yaw), fz=-Math.cos(P.yaw), ox=P.x, oz=P.z;
  let nx=P.x+(fx*f+(-fz)*r)*sp, nz=P.z+(fz*f+fx*r)*sp;
  const lim=cur===0?13.1:230, rr=Math.hypot(nx,nz); if(rr>lim){ nx*=lim/rr; nz*=lim/rr; }
  for(let d=1;d<=4;d++){ if(cur!==0&&cur!==d) continue; const D=doors[d], s0=(ox-D.c.x)*D.n.x+(oz-D.c.z)*D.n.z, s1=(nx-D.c.x)*D.n.x+(nz-D.c.z)*D.n.z;
    if((s0>0)!==(s1>0)){ const k=s0/(s0-s1), ix=ox+(nx-ox)*k, iz=oz+(nz-oz)*k, lat=(ix-D.c.x)*D.t.x+(iz-D.c.z)*D.t.z;
      if(Math.abs(lat)<DW/2){ cur=cur===0?d:0; roomEl.textContent=NAMES[cur]; break; }
      else if(Math.abs(lat)<DW/2+.5){ nx=ox; nz=oz; } } }
  if(cur===0){ const r2=Math.hypot(nx,nz); if(r2>13.1){ nx*=13.1/r2; nz*=13.1/r2; } }
  P.x=nx; P.z=nz; const moving=Math.hypot(nx-ox,nz-oz)>1e-4; if(moving) bob+=dt*(keys.shift?13:8.5);
  cam.position.set(P.x,1.72+(moving?Math.sin(bob)*.045:0),P.z); cam.rotation.set(P.pitch,P.yaw,0); cam.updateMatrixWorld();
  for(const u of upd) u(time,dt,P.x,P.z);
  render();
}
function loop(ms){ requestAnimationFrame(loop); tick(ms/1000); }
requestAnimationFrame(loop);
})();
</script>
